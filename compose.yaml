# DSH-ANYWORK · 一条命令部署（Linux 服务器通用）
#
#   1) cp .env.example .env   并填写 ANYWORK_HOST 与 DEEPSEEK_API_KEY
#   2) docker compose up -d --build     （首次构建约 15~25 分钟）
#   3) 浏览器打开 http://<ANYWORK_HOST>/  （管理员账号见 .env）
#
# 数据全部在 docker 卷 anywork_anywork-data 里；升级/重建容器不丢数据。
# 停止：docker compose down     查看日志：docker compose logs -f

name: anywork

services:
  anywork:
    # 本地构建（build-cn.sh）与云端镜像（GHCR）并存：
    #   本机：bash deploy/docker/build-cn.sh && docker compose up -d   （本地 build 出的镜像即打此名）
    #   服务器：docker compose pull && docker compose up -d            （只拉不编）
    image: ghcr.io/bugbyc0922/dsh-anywork:${ANYWORK_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    ports:
      # 监听地址：本机/局域网默认 0.0.0.0（手机可访问）；公网服务器建议 127.0.0.1（只走反代）
      - "${ANYWORK_BIND:-0.0.0.0}:${ANYWORK_PORT:-8080}:8080"
    volumes:
      - anywork-data:/data
    environment:
      ANYWORK_HOST: "${ANYWORK_HOST:?请在 .env 中设置 ANYWORK_HOST（访问地址，如 192.168.1.50:8080）}"
      ANYWORK_ADMIN_USER: "${ANYWORK_ADMIN_USER:-boss}"
      ANYWORK_ADMIN_PASSWORD: "${ANYWORK_ADMIN_PASSWORD:-}"
      ANYWORK_MEMBERS: "${ANYWORK_MEMBERS:-}"
      ANYWORK_TRUSTED_HOSTS: "${ANYWORK_TRUSTED_HOSTS:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?请在 .env 中设置 DEEPSEEK_API_KEY}"
      TZ: "${TZ:-Asia/Shanghai}"

volumes:
  anywork-data:
